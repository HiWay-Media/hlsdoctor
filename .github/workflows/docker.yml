name: Docker

# The container image, ghcr.io/hiway-media/hlsdoctor, for linux/amd64 and linux/arm64.
#   pull request  → built for both platforms and smoke-run, nothing pushed
#   push to main  → :main and :sha-<short>, for dogfooding before a release
#   tag v*        → :<version>, :<major.minor>, :latest — the tag must match VERSION
# Re-run a release's image with `gh workflow run Docker -f tag=v0.1.0`; pushing the same tags is idempotent.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish the image for, e.g. v0.1.0'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/hiway-media/hlsdoctor

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        name: Resolve the version the binary reports
        env:
          TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
        run: |
          set -eu
          FILE_VERSION="$(tr -d ' \n' < VERSION)"
          if [ -n "$TAG" ]; then
            if [ "${TAG#v}" != "$FILE_VERSION" ]; then
              echo "::error::tag $TAG says ${TAG#v} but VERSION says $FILE_VERSION"; exit 1
            fi
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=v$FILE_VERSION-dev+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.tag }},enable=${{ steps.v.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.tag }},enable=${{ steps.v.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ steps.v.outputs.tag != '' }}
            type=raw,value=main,enable=${{ steps.v.outputs.tag == '' && github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ steps.v.outputs.tag == '' && github.ref == 'refs/heads/main' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - uses: docker/setup-buildx-action@v4
      # One platform loaded into the runner's daemon and run: the binary starts, reports the
      # version it was built with, and refuses an empty target list with exit 2. No stream is called.
      - name: Build for linux/amd64 and smoke-run
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          load: true
          tags: hlsdoctor:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        env:
          WANT: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          GOT="$(docker run --rm hlsdoctor:smoke version)"
          echo "$GOT"
          [ "$GOT" = "hlsdoctor $WANT" ] || { echo "::error::image reports '$GOT', want 'hlsdoctor $WANT'"; exit 1; }
          set +e; docker run --rm hlsdoctor:smoke check; code=$?; set -e
          [ "$code" = 2 ] || { echo "::error::'check' with no target exited $code, want 2"; exit 1; }
          [ "$(docker inspect -f '{{.Config.User}}' hlsdoctor:smoke)" = "nonroot:nonroot" ] || { echo "::error::image must run as nonroot"; exit 1; }
          docker images hlsdoctor:smoke --format 'size {{.Size}}'
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build for both platforms, push unless a pull request
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - if: github.event_name != 'pull_request'
        name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          { echo "### Pushed"; echo; for t in $TAGS; do echo "- \`$t\`"; done; } >> "$GITHUB_STEP_SUMMARY"
